<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sena Şener Konseri - Geri Sayım</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .image-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('sena-sener.png');
      background-size: 893px 983px;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    .content {
      padding: 20px;
      text-align: center;
      z-index: 1;
      position: relative;
      max-width: 90%;
      margin-top: 20vh;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
    }

    p {
      font-size: 1.5rem;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
    }

    .countdown {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .time-box {
      background-color: rgba(0, 0, 0, 0.7);
      border: 2px solid #444;
      border-radius: 12px;
      padding: 20px 25px;
      min-width: 90px;
      backdrop-filter: blur(5px);
    }

    .time {
      font-size: 2.5rem;
      font-weight: bold;
    }

    .label {
      font-size: 1.1rem;
      margin-top: 5px;
      color: #ccc;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .time {
        font-size: 2rem;
      }
    }

    .footer-note {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-size: 1.1rem;
      font-family: 'Pacifico', cursive;
      background: linear-gradient(45deg, #f9a8d4, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="image-container"></div>

  <div class="content">
    <h1>Sena Şener Konseri</h1>
    <p>3 Mayıs 2025 Cumartesi - Saat 21:00</p>
    <div class="countdown">
      <div class="time-box">
        <div class="time" id="days">00</div>
        <div class="label">Gün</div>
      </div>
      <div class="time-box">
        <div class="time" id="hours">00</div>
        <div class="label">Saat</div>
      </div>
      <div class="time-box">
        <div class="time" id="minutes">00</div>
        <div class="label">Dakika</div>
      </div>
      <div class="time-box">
        <div class="time" id="seconds">00</div>
        <div class="label">Saniye</div>
      </div>
    </div>
  </div>

  <div class="footer-note">İpek’i çok seviyorum</div>

  <script>
    const countdown = () => {
      const eventDate = new Date("2025-05-03T21:00:00+03:00").getTime();
      const now = new Date().getTime();
      const diff = eventDate - now;

      if (diff < 0) return;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = days.toString().padStart(2, '0');
      document.getElementById("hours").textContent = hours.toString().padStart(2, '0');
      document.getElementById("minutes").textContent = minutes.toString().padStart(2, '0');
      document.getElementById("seconds").textContent = seconds.toString().padStart(2, '0');
    };

    countdown();
    setInterval(countdown, 1000);
  </script>
</body>
</html>
